name: CI-Dev

on:
  push:
    branches:
      - main
      - cicd
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/techgather/tg-fe-dev
      CONTEXT: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag from Commit
        id: get_tag
        run: |
          RAW_TAG=$(git tag --points-at HEAD | grep '^v' | head -n 1 || echo "")
          CLEAN_TAG=${RAW_TAG#v}
          echo "tag=$CLEAN_TAG" >> "$GITHUB_OUTPUT"
          echo "Detected Tag: $RAW_TAG (Cleaned: $CLEAN_TAG)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ steps.get_tag.outputs.tag }},enable=${{ steps.get_tag.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cicd' || github.event_name == 'workflow_dispatch' }}

      - name: Create .env file
        run: echo "${{ secrets.ENV_DEV }}" > ./.env

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  deploy:
    needs: [build]
    if: needs.build.result == 'success'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd-dev.yml
    secrets: inherit
